<div id="travel-booking-preview">
  <style>
    #travel-booking-preview{--paper:light-dark(#f4f5ef,#14221e);--panel:light-dark(#ffffff,#21342d);--ink:light-dark(#18392f,#edf4ee);--muted:light-dark(#52675f,#b0c3b8);--line:light-dark(#d5e0d7,#41564b);--brand:light-dark(#155943,#c5e5bd);--onbrand:light-dark(#ffffff,#18392f);--bubble:light-dark(#e2efda,#36503b);color:var(--ink);font:15px/1.5 system-ui,sans-serif;max-width:520px;margin:auto}
    #travel-booking-preview *{box-sizing:border-box}#travel-booking-preview .phone{background:var(--paper);border:1px solid var(--line);border-radius:22px;overflow:hidden}#travel-booking-preview header{background:var(--brand);color:var(--onbrand);padding:18px 20px;display:flex;align-items:center;gap:12px}#travel-booking-preview .avatar{border:1px solid currentColor;border-radius:50%;width:40px;height:40px;display:grid;place-items:center;font:26px Georgia,serif}#travel-booking-preview h2{font:600 16px/1.4 system-ui;margin:0}#travel-booking-preview .sub{font-size:12px}#travel-booking-preview .demo{padding:8px 16px;text-align:center;background:var(--panel);color:var(--muted);font-size:12px}#travel-booking-preview .inside{padding:18px}#travel-booking-preview .context{font-size:12px;color:var(--muted);margin-bottom:12px}#travel-booking-preview .you{background:var(--bubble);border-radius:14px 3px 14px 14px;padding:10px 14px;margin:0 0 14px auto;width:fit-content;max-width:95%;overflow-wrap:anywhere}#travel-booking-preview .bot{background:var(--panel);padding:16px;border-radius:3px 14px 14px 14px}#travel-booking-preview .bot p{margin:0 0 12px}#travel-booking-preview .bot p:last-child{margin:0}#travel-booking-preview .choices{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}#travel-booking-preview button{font:500 14px/1.4 system-ui;cursor:pointer;min-height:44px;border:1px solid var(--line);border-radius:10px;padding:10px 13px;background:var(--panel);color:var(--ink)}#travel-booking-preview button.primary{background:var(--brand);color:var(--onbrand);border-color:var(--brand)}#travel-booking-preview button:hover{filter:brightness(.94)}#travel-booking-preview button:focus-visible,#travel-booking-preview input:focus-visible,#travel-booking-preview select:focus-visible{outline:3px solid var(--brand);outline-offset:2px}#travel-booking-preview .option{display:block;width:100%;text-align:left;margin-top:10px}#travel-booking-preview .option strong,#travel-booking-preview .option small{display:block}#travel-booking-preview .option small{font-weight:400;color:var(--muted);margin-top:4px;font-size:12px}#travel-booking-preview .price{float:right;font-weight:650}#travel-booking-preview label{display:block;margin-top:12px;font-size:13px}#travel-booking-preview input,#travel-booking-preview select{display:block;width:100%;padding:11px;border:1px solid var(--line);border-radius:8px;font:16px system-ui;background:var(--panel);color:var(--ink);margin-top:5px}#travel-booking-preview .fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}#travel-booking-preview .error{color:light-dark(#a32e25,#ffb0a5);font-size:13px;margin-top:10px}#travel-booking-preview .foot{display:flex;gap:8px;flex-wrap:wrap;padding:12px 18px;border-top:1px solid var(--line);background:var(--panel)}#travel-booking-preview .foot button{font-size:12px;padding:8px 10px}#travel-booking-preview .summary{display:grid;grid-template-columns:1fr auto;gap:7px;margin:12px 0;font-size:14px}#travel-booking-preview .summary strong{font-weight:600}#travel-booking-preview .muted{color:var(--muted);font-size:12px}#travel-booking-preview .composer{display:flex;gap:8px;margin-top:14px}#travel-booking-preview .composer input{margin:0;min-width:0;flex:1}#travel-booking-preview .composer button{flex:none}@media(max-width:380px){#travel-booking-preview .inside{padding:12px}#travel-booking-preview .fields{grid-template-columns:1fr}#travel-booking-preview .price{float:none;display:block}}
  </style>
  <section class="phone" aria-label="Interactive travel assistant preview">
    <header><span class="avatar">V</span><div><h2>VoyageZero</h2><div class="sub">Your travel assistant</div></div></header>
    <div class="demo">Your Excel catalogue · simulated prices & bookings</div>
    <div class="inside"><div id="tp-context" class="context"></div><div id="tp-last" class="you" hidden></div><div id="tp-screen" class="bot" aria-live="polite"></div></div>
    <nav class="foot" aria-label="Travel menu"><button data-nav="home">New search</button><button data-nav="bookings">My bookings</button><button data-nav="agent">Talk to an agent</button></nav>
  </section>
  <script>
  (()=>{
    const root=document.getElementById('travel-booking-preview'),screen=root.querySelector('#tp-screen'),context=root.querySelector('#tp-context'),last=root.querySelector('#tp-last');
    const catalogue=[{"country": "India", "city": "Mumbai", "airport": "Chhatrapati Shivaji Maharaj Intl (BOM)", "hotels": ["The Taj Mahal Palace", "Trident Nariman Point"], "cabs": ["Uber", "Ola", "Local Airport Taxis"]}, {"country": "India", "city": "Delhi", "airport": "Indira Gandhi Intl (DEL)", "hotels": ["The Leela Palace", "Taj Palace"], "cabs": ["Uber", "BluSmart", "Meru Cabs"]}, {"country": "United States", "city": "New York", "airport": "John F. Kennedy Intl (JFK)", "hotels": ["The Plaza Hotel", "Marriott Marquis Times Square"], "cabs": ["Yellow Cab", "Uber", "Lyft"]}, {"country": "United States", "city": "Los Angeles", "airport": "Los Angeles Intl (LAX)", "hotels": ["The Beverly Hills Hotel", "The Ritz-Carlton"], "cabs": ["Uber", "Lyft", "LAX-it Shuttles"]}, {"country": "United Arab Emirates", "city": "Dubai", "airport": "Dubai Intl (DXB)", "hotels": ["Burj Al Arab", "Atlantis The Palm"], "cabs": ["Careem", "Dubai Taxi Corporation (DTC)"]}, {"country": "United Kingdom", "city": "London", "airport": "Heathrow Airport (LHR)", "hotels": ["The Savoy", "The Ritz London"], "cabs": ["Black Cabs", "Uber", "Addison Lee"]}, {"country": "Singapore", "city": "Singapore", "airport": "Changi Airport (SIN)", "hotels": ["Marina Bay Sands", "Raffles Hotel"], "cabs": ["Grab", "ComfortDelGro"]}, {"country": "France", "city": "Paris", "airport": "Charles de Gaulle (CDG)", "hotels": ["Hôtel Ritz", "Four Seasons George V"], "cabs": ["G7 Taxis", "Uber", "Free Now"]}, {"country": "Japan", "city": "Tokyo", "airport": "Narita Intl (NRT)", "hotels": ["Aman Tokyo", "Park Hyatt"], "cabs": ["Japan Taxi", "Uber (Premium)", "GO App"]}];
    const money=n=>new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:0}).format(n);
    const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const day=(n=0)=>{const d=new Date();d.setDate(d.getDate()+n);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
    let state={step:'home',type:'hotel',city:'Mumbai',origin:'Mumbai',date:day(1),nights:1,count:1,budget:5000,choice:0,name:'Demo Traveller',email:'traveller@example.com',last:'',bookings:[]};
    const saved=window.openai?.widgetState?.privateContent;if(saved?.version===2&&saved.state)state={...state,...saved.state};
    function save(){window.openai?.setWidgetState?.({modelContent:{preview:'guided travel booking',step:state.step,type:state.type,city:state.city},privateContent:{version:2,state}})?.catch(()=>{});}
    function go(step,label){state.step=step;if(label)state.last=label;save();render();}
    function buttons(items){return '<div class="choices">'+items.map(([label,action,primary])=>'<button '+(primary?'class="primary" ':'')+'data-action="'+action+'">'+label+'</button>').join('')+'</div>'}
    function options(){const c=catalogue.find(c=>c.city===state.city)||catalogue[0];
      const entries=state.type==='hotel'?c.hotels:state.type==='cab'?c.cabs:['Demo Air 201','Demo Air 101'];
      return entries.map((name,i)=>({id:i,name,detail:state.type==='flight'?'Fictional flight · '+c.airport:'From your Excel · availability unverified',price:(state.type==='hotel'?6500+i*2500:state.type==='cab'?600+i*250:3400+i*1400)*(state.type==='hotel'?state.nights:state.type==='flight'?state.count:1)}));}
    const selected=()=>options()[state.choice];
    function summary(){const o=selected();return '<p><strong>'+esc(o.name)+'</strong><br>'+esc(state.type==='hotel'?state.city:state.origin+' → '+state.city)+'</p><div class="summary"><span>Date</span><span>'+esc(state.date)+'</span><span>'+(state.type==='hotel'?'Stay':'Travellers')+'</span><span>'+(state.type==='hotel'?state.nights+' night(s), 1 room':state.count)+'</span><span>Illustrative fare, including taxes</span><span>'+money(o.price)+'</span><span>Agency fee</span><span>'+money(100)+'</span><strong>Total</strong><strong>'+money(o.price+100)+'</strong></div>'}
    function render(){
      context.textContent=state.step==='home'?'Plan → Compare → Review → Book':({hotel:'Hotel',flight:'Flight',cab:'Cab'}[state.type]+' · '+state.city+' · '+state.date);
      last.hidden=!state.last;last.textContent=state.last;
      if(state.step==='home'){screen.innerHTML='<p><strong>Where would you like to go?</strong></p><p>Explore your 9 cities, 18 hotels and 25 cab-service entries.</p>'+buttons([['Flights','flight'],['Hotels','hotel',true],['Cabs','cab']])+'<form id="tp-chat" class="composer"><input aria-label="Travel request" placeholder="Try: hotle in mumbay tmrw" maxlength="150"><button type="submit">Send</button></form>';}
      else if(state.step==='clarify'){screen.innerHTML='<p>Did you mean <strong>a hotel in Mumbai tomorrow</strong>?</p>'+buttons([['Yes, that’s right','confirm-city',true],['Choose another city','city']]);}
      else if(state.step==='unknown'){screen.innerHTML='<p>I’m not sure which service you need. Choose one to continue this preview.</p>'+buttons([['Flights','flight'],['Hotels','hotel'],['Cabs','cab']]);}
      else if(state.step==='city'){screen.innerHTML='<p><strong>'+(state.type==='hotel'?'Where would you like to stay?':'Where are you going?')+'</strong></p><form id="tp-city"><label>Destination<select name="city">'+catalogue.map(c=>c.city).map(c=>'<option '+(c===state.city?'selected':'')+'>'+c+'</option>').join('')+'</select></label>'+(state.type!=='hotel'?'<label>'+(state.type==='cab'?'Pickup location':'Departure city')+'<input name="origin" value="'+esc(state.origin)+'" required maxlength="80"></label>':'')+'<div class="choices"><button class="primary">Continue</button></div></form>';}
      else if(state.step==='dates'){screen.innerHTML='<p><strong>'+(state.type==='hotel'?'When are you checking in?':'When would you like to travel?')+'</strong></p>'+buttons([['Today','today'],['Tomorrow','tomorrow']])+'<form id="tp-dates"><label>'+(state.type==='hotel'?'Check-in date':'Travel date')+'<input name="date" type="date" min="'+day()+'" value="'+esc(state.date)+'" required></label><div class="fields">'+(state.type==='hotel'?'<label>Nights<select name="nights">'+[1,2,3,5,7].map(n=>'<option '+(n===state.nights?'selected':'')+'>'+n+'</option>').join('')+'</select></label>':'')+'<label>'+(state.type==='hotel'?'Guests':'Passengers')+'<select name="count">'+[1,2,3,4].map(n=>'<option '+(n===state.count?'selected':'')+'>'+n+'</option>').join('')+'</select></label></div><div class="choices"><button class="primary">Find options</button></div></form>';}
      else if(state.step==='results'){screen.innerHTML='<p><strong>Options from your sample catalogue</strong></p><p class="muted">Illustrative INR prices, not supplier quotes · '+(state.type==='hotel'?'full stay price for 1 room':'total for your selection')+' · ₹100 agency fee added at review</p>'+options().map(o=>'<button class="option" data-option="'+o.id+'"><span class="price">'+money(o.price)+'</span><strong>'+esc(o.name)+'</strong><small>'+esc(o.detail)+'</small></button>').join('')+buttons([['Change dates','dates'],['Change destination','city']]);}
      else if(state.step==='review'){screen.innerHTML=summary()+'<p class="muted">Demo cancellation: full refund before the selected date. Final supplier terms would appear here.</p>'+buttons([['Choose this option','details',true],['Other options','results']]);}
      else if(state.step==='details'){screen.innerHTML='<p><strong>Who is travelling?</strong></p><p class="muted">Use sample details in this preview.</p><form id="tp-details"><label>Full name<input name="name" value="'+esc(state.name)+'" required minlength="2" maxlength="80"></label><label>Email<input name="email" type="email" value="'+esc(state.email)+'" required maxlength="120"></label><div class="choices"><button class="primary">Review booking</button></div></form>';}
      else if(state.step==='checkout'){screen.innerHTML='<p><strong>Everything look right?</strong></p>'+summary()+'<p>'+esc(state.name)+'<br>'+esc(state.email)+'</p>'+buttons([['Continue to demo payment','payment',true],['Edit details','details'],['Change option','results']]);}
      else if(state.step==='payment'){screen.innerHTML='<p><strong>Simulated secure checkout</strong></p><p>Total: <strong>'+money(selected().price+100)+'</strong></p><p class="muted">No card or UPI details required. No money moves.</p>'+buttons([['Simulate success','pay-success',true],['Simulate failure','pay-fail']]);}
      else if(state.step==='failed'){screen.innerHTML='<p><strong>Payment was not completed.</strong></p><p>No booking was created. Your selection is saved.</p>'+buttons([['Try payment again','payment',true],['Change option','results']]);}
      else if(state.step==='confirmed'){const b=state.bookings[state.bookings.length-1];screen.innerHTML='<p><strong>Demo booking confirmed</strong></p><p>'+esc(b.id)+'<br>'+esc(b.name)+' · '+esc(b.city)+'<br>'+esc(b.date)+'</p><p>Total: '+money(b.total)+'</p><p class="muted">Simulated payment and reservation. Not valid for travel.</p>'+buttons([['View travel summary','voucher',true],['My bookings','bookings'],['Plan another trip','home']]);}
      else if(state.step==='bookings'){screen.innerHTML='<p><strong>Your demo bookings</strong></p>'+(state.bookings.length?state.bookings.map((b,i)=>'<p>'+esc(b.id)+' · '+esc(b.name)+'<br>'+esc(b.city)+' · '+esc(b.date)+' · '+money(b.total)+'<br><strong>'+esc(b.status)+'</strong></p>'+(b.status==='Confirmed'?'<button data-cancel="'+i+'">Cancel this booking</button>':'')+'<hr>').join(''):'<p>No bookings yet.</p>')+buttons([['Start a new trip','home',true]]);}
      else if(state.step==='cancel'){screen.innerHTML='<p><strong>Cancel this demo booking?</strong></p><p>Your simulated refund will be '+money(state.bookings[state.cancelIndex].total)+'. No real money was paid.</p>'+buttons([['Keep booking','bookings',true],['Confirm cancellation','cancel-confirm']]);}
      else if(state.step==='voucher'){const b=state.bookings[state.bookings.length-1];screen.innerHTML='<p><strong>Demo travel summary</strong></p><p>'+esc(b.id)+'<br>'+esc(b.name)+'<br>'+esc(b.city)+' · '+esc(b.date)+'<br>'+esc(b.traveller)+'<br>'+money(b.total)+' · '+esc(b.status)+'</p><p class="muted">NOT VALID FOR TRAVEL</p>'+buttons([['My bookings','bookings'],['New trip','home']]);}
      else if(state.step==='agent'){screen.innerHTML='<p><strong>Need a hand?</strong></p><p>In the live service, your agency would receive this conversation and take over.</p><p class="muted">Preview only: no agent has been contacted.</p>'+buttons([['Back to travel menu','home',true]]);}
    }
    root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.nav){go(b.dataset.nav,b.textContent);return}if(b.dataset.option!==undefined){state.choice=Number(b.dataset.option);go('review',selected().name);return}if(b.dataset.cancel!==undefined){state.cancelIndex=Number(b.dataset.cancel);go('cancel','Cancel booking');return}const a=b.dataset.action;if(!a){const form=b.closest('form');if(form){e.preventDefault();submitForm(form)}return}if(['hotel','flight','cab'].includes(a)){state.type=a;state.origin=a==='cab'?'Mumbai airport':'Mumbai';go('city',b.textContent)}else if(a==='confirm-city'){state.type='hotel';state.city='Mumbai';state.date=day(1);go('dates','Yes, hotel in Mumbai tomorrow')}else if(a==='today'||a==='tomorrow'){state.date=day(a==='today'?0:1);go('dates',b.textContent)}else if(a==='pay-success'){const o=selected();state.bookings.push({id:'DEMO-'+String(state.bookings.length+1).padStart(4,'0'),name:o.name,city:state.city,date:state.date,total:o.price+100,traveller:state.name,status:'Confirmed'});go('confirmed','Simulated payment successful')}else if(a==='pay-fail'){go('failed','Simulated payment failure')}else if(a==='cancel-confirm'){state.bookings[state.cancelIndex].status='Cancelled · simulated refund completed';go('bookings','Cancellation confirmed')}else go(a,b.textContent)});
    function submitForm(f){if(!f.reportValidity())return;const d=new FormData(f);if(f.id==='tp-city'){state.city=d.get('city');state.origin=d.get('origin')||state.origin;go('dates',state.type==='hotel'?state.city:state.origin+' → '+state.city)}else if(f.id==='tp-dates'){state.date=d.get('date');state.nights=Number(d.get('nights')||1);state.count=Number(d.get('count'));go('results',state.date+(state.type==='hotel'?' · '+state.nights+' night(s)':''))}else if(f.id==='tp-details'){state.name=d.get('name').trim();state.email=d.get('email').trim();go('checkout','Traveller details entered')}else if(f.id==='tp-chat'){const t=f.querySelector('input').value.trim();if(!t)return;const l=t.toLowerCase();if(/hotel|hotle|hotl|stay|room/.test(l)&&/mumbai|mumbay|bombay/.test(l)){go('clarify',t)}else{const type=/flight|flite|fly/.test(l)?'flight':/cab|taxi|ride/.test(l)?'cab':/hotel|hotle|stay/.test(l)?'hotel':null;if(type){state.type=type;go('city',t)}else go('unknown',t)}}}
    root.addEventListener('submit',e=>{e.preventDefault();submitForm(e.target)});
    window.addEventListener('openai:set_globals',e=>{const s=e.detail?.globals?.widgetState?.privateContent;if(s?.version===2&&s.state){state={...state,...s.state};render()}});
    render();
  })();
  </script>
</div>
